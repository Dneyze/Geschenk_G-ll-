<style>
:root{--bg1:#f8f3ea;--bg2:#f1e8da;--fg:#2b2220;--muted:#8a7a70;--card:rgba(255,255,255,.7);--bg3:#ece1d0;--lilac:#9b2335;--accent:#9b2335;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1c1716;--bg2:#241d1c;--fg:#f1e9e0;--muted:#a8998e;--card:rgba(255,255,255,.06);--bg3:#2a2120;--lilac:#d9776f;--accent:#d9776f}}
:root[data-theme="dark"]{--bg1:#1c1716;--bg2:#241d1c;--fg:#f1e9e0;--muted:#a8998e;--card:rgba(255,255,255,.06);--bg3:#2a2120;--lilac:#d9776f;--accent:#d9776f}
html{overflow-x:hidden}
html,body{min-height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;color:var(--fg);font-family:"Nunito",system-ui,sans-serif;display:flex;align-items:stretch;justify-content:center;text-align:center;overflow-x:hidden;min-height:100vh;min-height:100dvh;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main{position:relative;z-index:1;margin:auto;padding:24px 20px;width:100%;max-width:520px;box-sizing:border-box}
.photo{display:none;width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:0 6px 24px rgba(214,69,107,.3);margin:0 auto 12px}
.date{margin-bottom:.35em;font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:clamp(2.2rem,10.5vw,4.4rem);line-height:1.1;white-space:nowrap;color:var(--accent);text-shadow:0 6px 30px rgba(60,40,30,.18)}
.msg{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:1.25rem;margin:.3em 0 0;text-transform:capitalize}
h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:400;font-size:1.15rem;margin:1.1em 0 .9em;color:var(--muted);text-transform:capitalize}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.box{min-width:0;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:14px 2px;box-shadow:0 4px 20px rgba(60,40,30,.10)}
.box{--c:var(--accent);border:1px solid rgba(155,35,53,.18);box-shadow:0 2px 14px rgba(60,40,30,.06)}
.box b{display:block;white-space:nowrap;font-size:clamp(1rem,4.6vw,1.7rem);font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
.box span{color:var(--muted);font-size:.75rem;text-transform:capitalize}
.banner{display:none;margin-top:1rem;background:var(--card);border-radius:18px;padding:14px 16px;font-family:"Playfair Display",Georgia,serif;font-size:1.25rem;text-transform:capitalize;color:var(--accent);box-shadow:0 4px 20px rgba(60,40,30,.15)}
.conf{position:fixed;z-index:6;top:-16px;width:9px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.turtle{position:fixed;left:-160px;top:58%;z-index:2;width:clamp(110px,30vw,150px);pointer-events:none;filter:drop-shadow(0 6px 8px rgba(120,20,40,.28));animation:swim 34s linear infinite}
.turtle svg{display:block;overflow:visible;width:100%;height:auto;animation:bob 3.2s ease-in-out infinite}
.turtle .fl{animation:paddle 1.6s ease-in-out infinite alternate}
.turtle .fl.b{animation-delay:-.8s}
@keyframes swim{0%{transform:translate(0,0) rotate(4deg)}20%{transform:translate(26vw,-7vh) rotate(-5deg)}40%{transform:translate(52vw,3vh) rotate(5deg)}60%{transform:translate(78vw,-8vh) rotate(-5deg)}80%{transform:translate(104vw,2vh) rotate(4deg)}100%{transform:translate(130vw,-4vh) rotate(0)}}
.turtle .hd{animation:nod 2.4s ease-in-out infinite alternate}
.turtle .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes nod{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-4px) scale(1.02)}}
@keyframes paddle{from{transform:rotate(0)}to{transform:rotate(var(--r))}}
.fly{position:fixed;left:-70px;z-index:2;cursor:pointer;opacity:.85;transition:opacity .5s;animation:cross linear infinite}
.fly svg{display:block;animation:flap .45s ease-in-out infinite alternate}
@keyframes cross{0%{transform:translate(0,0) rotate(10deg)}20%{transform:translate(22vw,-9vh) rotate(-12deg)}40%{transform:translate(45vw,5vh) rotate(12deg)}60%{transform:translate(68vw,-8vh) rotate(-10deg)}80%{transform:translate(90vw,4vh) rotate(10deg)}100%{transform:translate(115vw,-6vh) rotate(0)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
.heart{position:fixed;bottom:-40px;color:var(--accent);opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:.35}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
.pop{position:fixed;z-index:5;pointer-events:none;color:var(--accent);animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@media (max-width:420px){
  main{padding:16px 14px}
  .photo{width:92px;height:92px;margin-bottom:8px}
  .row{gap:8px}
  .box{padding:11px 2px;border-radius:15px}
  h1{margin:.8em 0 .7em}
}
@media (max-height:520px) and (orientation:landscape){
  main{padding:12px 20px;max-width:760px}
  .photo{display:none!important}
  .row{grid-template-columns:repeat(6,1fr)}
  h1{margin:.5em 0 .6em}
}
@media (prefers-reduced-motion:reduce){.heart,.fly,.turtle,.conf,.pop{display:none}}
</style>
</head>
<body>
<main>
  <img class="photo" id="photo" alt="">
  <div class="date">1. Eylül 2026</div>
  <div class="msg" id="msg"></div>
  <div class="row">
    <div class="box"><b id="y">0</b><span>yıl</span></div>
    <div class="box"><b id="mo">0</b><span>ay</span></div>
    <div class="box"><b id="d">0</b><span>gün</span></div>
    <div class="box"><b id="h">0</b><span>saat</span></div>
    <div class="box"><b id="m">0</b><span>dakika</span></div>
    <div class="box"><b id="s">0</b><span>saniye</span></div>
  </div>
  <div class="banner" id="banner"></div>
</main>
<script>
// ---- Persönliche Einstellungen ----
const MESSAGE = "";
const PHOTO   = "";                 // Bild als data:-URL
const MUSIC   = "";                 // Lied als data:-URL
// ------------------------------------
const start = new Date(2026, 8, 1, 0, 0, 0);
const $ = id => document.getElementById(id);
const cols = ["#e9b44c","#b995e0","#ff9e7d","#8cc3e6","#f2c94c","#c9a6f2"];

$("msg").textContent = MESSAGE;
if (PHOTO){ $("photo").src = PHOTO; $("photo").style.display = "block"; }

function confetti(n){}
let celebrated = false;
function celebrate(text, em){ em = em || "🎉";
  $("banner").style.display = "block";
  $("banner").textContent = text;
  if (!celebrated){ celebrated = true; confetti(70); }
}
const test = new URLSearchParams(location.search).get("test");
// Test: 20x schnell tippen — auf das Datum (Jahrestag) oder auf den Namen (Geburtstag)
function tapTest(sel, text, em){
  let taps = 0, tm;
  document.querySelector(sel).addEventListener("pointerdown", () => {
    clearTimeout(tm); tm = setTimeout(() => taps = 0, 2000);
    if (++taps >= 20){
      taps = 0;
      $("banner").style.display = "block";
      $("banner").textContent = text;
      confetti(70);
    }
  });
}
tapTest(".date", "1. yıl dönümümüz kutlu olsun!", "🎉");
tapTest(".row", "20. yaş günün kutlu olsun!", "");

function tick(){
  const now = new Date();
  const before = now < start;
  let tm = (now.getFullYear() - start.getFullYear()) * 12 + now.getMonth() - start.getMonth();
  if (before || tm < 0) tm = 0;
  const rem = before ? 0 : now - new Date(start.getFullYear(), start.getMonth() + tm, 1);
  $("y").textContent = Math.floor(tm / 12);
  $("mo").textContent = tm % 12;
  $("d").textContent = Math.floor(rem / 864e5);
  $("h").textContent = Math.floor(rem % 864e5 / 36e5);
  $("m").textContent = Math.floor(rem % 36e5 / 6e4);
  $("s").textContent = Math.floor(rem % 6e4 / 1e3);

  if (test) celebrate((+test || 1) + ". yıl dönümümüz kutlu olsun!");
  else if (now.getMonth() === 4 && now.getDate() === 5)
    celebrate((now.getFullYear() - 2007) + ". yaş günün kutlu olsun, Aşkım!", "🎂");
  else if (!before && now.getMonth() === 8 && now.getDate() === 1 && tm >= 12)
    celebrate(Math.round(tm / 12) + ". yıl dönümümüz kutlu olsun!");
}
tick(); setInterval(tick, 1000);


</script>
</body>
</html>
